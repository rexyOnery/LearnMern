services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000/api}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - mern-network

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      AUTH_SERVICE_URL: http://auth-service:4101
      USER_SERVICE_URL: http://user-service:4102
      PRODUCT_SERVICE_URL: http://product-service:4103
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      CORS_ORIGIN: ${FRONTEND_URL:-http://localhost:3000},http://localhost:5173
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
    ports:
      - "${API_GATEWAY_PORT:-4000}:4000"
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks:
      - mern-network

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4101
      MONGODB_URI: ${AUTH_MONGODB_URI:-mongodb://mongo-auth:27017/auth_service}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      CORS_ORIGIN: http://api-gateway:4000
    ports:
      - "${AUTH_SERVICE_PORT:-4101}:4101"
    depends_on:
      mongo-auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4101/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks:
      - mern-network

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4102
      MONGODB_URI: ${USER_MONGODB_URI:-mongodb://mongo-user:27017/user_service}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      CORS_ORIGIN: http://api-gateway:4000
    ports:
      - "${USER_SERVICE_PORT:-4102}:4102"
    depends_on:
      mongo-user:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4102/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks:
      - mern-network

  product-service:
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4103
      MONGODB_URI: ${PRODUCT_MONGODB_URI:-mongodb://mongo-product:27017/product_service}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      CORS_ORIGIN: http://api-gateway:4000
    ports:
      - "${PRODUCT_SERVICE_PORT:-4103}:4103"
    depends_on:
      mongo-product:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4103/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks:
      - mern-network

  mongo-auth:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-auth-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks:
      - mern-network

  mongo-user:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-user-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks:
      - mern-network

  mongo-product:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-product-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks:
      - mern-network

volumes:
  mongo-auth-data:
  mongo-user-data:
  mongo-product-data:

networks:
  mern-network:
    driver: bridge

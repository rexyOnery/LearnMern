trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  nodeVersion: '20.x'
  VERCEL_CLI_TELEMETRY_DISABLED: '1'

stages:
  - stage: Validate
    displayName: Validate application
    jobs:
      - job: LintTestBuild
        displayName: Lint, test, and build
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: Use Node.js

          - script: npm install
            displayName: Install dependencies

          - script: npm run lint
            displayName: Lint

          - script: npm test
            displayName: Test

          - script: npm run build
            displayName: Build workspaces

  - stage: VercelPreview
    displayName: Deploy Vercel preview
    dependsOn: Validate
    condition: and(succeeded(), ne(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployPreview
        displayName: Deploy preview to Vercel
        environment: vercel-preview
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: NodeTool@0
                  inputs:
                    versionSpec: $(nodeVersion)
                  displayName: Use Node.js

                - script: npm install
                  displayName: Install dependencies

                - script: npx vercel@latest pull --yes --environment=preview
                  displayName: Pull Vercel preview configuration
                  env:
                    VERCEL_TOKEN: $(VERCEL_TOKEN)
                    VERCEL_ORG_ID: $(VERCEL_ORG_ID)
                    VERCEL_PROJECT_ID: $(VERCEL_PROJECT_ID)

                - script: npx vercel@latest build
                  displayName: Build Vercel preview output
                  env:
                    VERCEL_TOKEN: $(VERCEL_TOKEN)
                    VERCEL_ORG_ID: $(VERCEL_ORG_ID)
                    VERCEL_PROJECT_ID: $(VERCEL_PROJECT_ID)

                - script: npx vercel@latest deploy --prebuilt --archive=tgz
                  displayName: Deploy Vercel preview
                  env:
                    VERCEL_TOKEN: $(VERCEL_TOKEN)
                    VERCEL_ORG_ID: $(VERCEL_ORG_ID)
                    VERCEL_PROJECT_ID: $(VERCEL_PROJECT_ID)

  - stage: VercelProduction
    displayName: Deploy Vercel production
    dependsOn: Validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployProduction
        displayName: Deploy production to Vercel
        environment: vercel-production
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: NodeTool@0
                  inputs:
                    versionSpec: $(nodeVersion)
                  displayName: Use Node.js

                - script: npm install
                  displayName: Install dependencies

                - script: npx vercel@latest pull --yes --environment=production
                  displayName: Pull Vercel production configuration
                  env:
                    VERCEL_TOKEN: $(VERCEL_TOKEN)
                    VERCEL_ORG_ID: $(VERCEL_ORG_ID)
                    VERCEL_PROJECT_ID: $(VERCEL_PROJECT_ID)

                - script: npx vercel@latest build --prod
                  displayName: Build Vercel production output
                  env:
                    VERCEL_TOKEN: $(VERCEL_TOKEN)
                    VERCEL_ORG_ID: $(VERCEL_ORG_ID)
                    VERCEL_PROJECT_ID: $(VERCEL_PROJECT_ID)

                - script: npx vercel@latest deploy --prebuilt --prod --archive=tgz
                  displayName: Deploy Vercel production
                  env:
                    VERCEL_TOKEN: $(VERCEL_TOKEN)
                    VERCEL_ORG_ID: $(VERCEL_ORG_ID)
                    VERCEL_PROJECT_ID: $(VERCEL_PROJECT_ID)
